test_name: マッピング画面表示_正常系

includes:
  - !include config.yaml

marks:
  - usefixtures:
    - login_sysadmin

stages:
  - name: マッピング画面表示id指定なし
    request:
      url: "{host}/admin/itemtypes/mapping/"
      method: GET
      verify: false
    response:
      status_code: 302
      headers:
        Location: "{host}/admin/itemtypes/mapping/1"

  - name: マッピング画面表示id指定あり
    request:
      url: "{host}/admin/itemtypes/mapping/41000"
      method: GET
      verify: false
    response:
      status_code: 200
      verify_response_with:
        function: helper.verify_helper:verify_option_selected
        extra_kwargs:
          expected_value: 41000

  - name: マッピング画面表示id指定あり_存在しないitem_type_id
    request:
      url: "{host}/admin/itemtypes/mapping/50000"
      method: GET
      verify: false
    response:
      status_code: 302
      headers:
        Location: "{host}/admin/itemtypes/mapping/1"

