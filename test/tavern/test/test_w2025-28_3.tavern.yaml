test_name: マッピング登録API_正常系
includes:
  - !include config.yaml
marks:
  - usefixtures:
      - login_sysadmin
  - test_test
stages:
  - name: マッピング登録API_正常系
    request:
      url: "{host}/admin/itemtypes/mapping"
      method: POST
      headers:
        Content-Type: application/json
      verify: false
      json: !include "{success_filename}"
    response:
      status_code: 200
      json:
        msg: "Successfully saved new mapping."

---
test_name: マッピング登録API_異常系

includes:
  - !include config.yaml

marks:
  - usefixtures:
    - login_sysadmin

stages:
  - name: マッピング登録API_id_null_異常系
    request:
      url: "{host}/admin/itemtypes/mapping"
      method: POST
      headers:
        Content-Type: application/json
      verify: false
      json: !include  "{error_null}"
    response:
      status_code: 400

  - name: マッピング登録API_id_abc_異常系
    request:
      url: "{host}/admin/itemtypes/mapping"
      method: POST
      headers:
        Content-Type: application/json
      verify: false
      json: !include  "{error_abc}"
    response:
      status_code: 400

  - name: マッピング登録API_id_欠損_異常系
    request:
      url: "{host}/admin/itemtypes/mapping"
      method: POST
      headers:
        Content-Type: application/json
      verify: false
      json: !include  "{error_noid}"
    response:
      status_code: 400

  - name: マッピング登録API_Header_error_異常系
    request:
      url: "{host}/admin/itemtypes/mapping"
      method: POST
      headers:
        Content-Type: multipart/form-data
      verify: false
      files:
        file: "{success_filename}"
    response:
      status_code: 200
      json:
        msg: "Header Error"

---
test_name: マッピング登録API_重複チェック有効

includes:
  - !include config.yaml

marks:
  - usefixtures:
    - login_sysadmin
  - duplicate_check

stages:
  - name: マッピング登録API_重複チェック有効
    request:
      url: "{host}/admin/itemtypes/mapping"
      method: POST
      headers:
        Content-Type: application/json
      verify: false
      json: !include "{duplicate_filename}"
    response:
      status_code: 200
      json:
        duplicate: true
        err_items: [["テキスト1", "テキスト2"]]
        msg: "Duplicate mapping as below:"